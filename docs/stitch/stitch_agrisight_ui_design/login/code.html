<body class="text-on-surface min-h-screen flex flex-col">
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-6 py-12">
<!-- Login Card Container -->
<div class="w-full max-auto max-w-[440px] flex flex-col gap-8">
<!-- Brand Identity Anchor -->
<div class="flex flex-col items-center gap-4">
<div class="w-16 h-16 bg-primary-container rounded-xl flex items-center justify-center text-primary">
<span class="material-symbols-outlined text-4xl" data-icon="potted_plant">potted_plant</span>
</div>
<div class="text-center">
<h1 class="headline-font font-extrabold text-3xl tracking-tight text-primary">AgriSight 🌱</h1>
<p class="text-on-surface-variant font-medium mt-1">Cultivating precision data.</p>
</div>
</div>
<!-- The Content Card: White space & Shadow Atmospheric -->
<div class="bg-surface-container-lowest rounded-xl p-10 shadow-[0_8px_24px_rgba(43,53,47,0.06)] border border-outline-variant/10">
<form action="#" class="flex flex-col gap-6">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label text-[10px] font-bold uppercase tracking-widest text-on-surface-variant px-1" for="email">
                            Email Address
                        </label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="mail">mail</span>
<input class="w-full h-16 pl-12 pr-4 rounded-lg bg-surface-container-low border-none focus:ring-2 focus:ring-primary/40 focus:bg-surface-container-lowest transition-all text-on-surface placeholder:text-outline/60" id="email" name="email" placeholder="farmer@agrisight.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="font-label text-[10px] font-bold uppercase tracking-widest text-on-surface-variant px-1" for="password">
                            Password
                        </label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors" data-icon="lock">lock</span>
<input class="w-full h-16 pl-12 pr-12 rounded-lg bg-surface-container-low border-none focus:ring-2 focus:ring-primary/40 focus:bg-surface-container-lowest transition-all text-on-surface placeholder:text-outline/60" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<div class="flex justify-end mt-1">
<a class="text-sm font-medium text-primary hover:text-primary-dim transition-colors" href="#">Forgot password?</a>
</div>
</div>
<!-- Action Layer -->
<div class="mt-4 flex flex-col gap-4">
<button class="h-16 w-full rounded-full bg-gradient-to-br from-primary to-primary-dim text-on-primary font-bold text-lg shadow-lg hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2" type="submit">
<span>Login</span>
<span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
<div class="flex items-center justify-center gap-2 py-2">
<span class="text-on-surface-variant text-sm">New to the field?</span>
<a class="text-primary font-bold hover:underline transition-all" href="#">Sign up</a>
</div>
</div>
</form>
</div>
<!-- Footer Minimalist -->
<footer class="text-center">
<p class="text-xs text-on-surface-variant/60 font-medium tracking-wide">
                    © 2024 AgriSight Editorial. All rights reserved.
                </p>
</footer>

</main>
